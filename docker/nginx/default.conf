# A mailed link carries a live token in its path. The app logs these routes as
# /reset-password/{token}; this is the same for nginx's line, which the app's
# redaction cannot reach. A new token route belongs in this list too.
map $request_uri $loggable_uri {
  "~^(?<route>/(?:reset-password|verify-email|change-email)/)[^/?]+(?<rest>.*)$" "${route}{token}${rest}";
  # A listen token rides in the query string of /stream.
  "~^(?<route>/stream\?(?:[^#]*&)?token=)[^&#]+(?<rest>.*)$" "${route}{token}${rest}";
  default $request_uri;
}

log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream php-fpm {
  server php:9000;
  keepalive 16;

  # MUST stay below php-fpm's request_terminate_timeout (30s, see
  # docker/php/fpm-pool.conf). php-fpm counts an idle keepalive connection as a
  # request still in flight, so whichever side times out first wins: if php-fpm
  # does, it SIGTERMs the worker and logs
  #   WARNING: [pool www] child N, script '' (request: " ") execution timed out
  # once per idle connection, ~30s after every burst of traffic. That churns
  # workers for nothing and buries real runaway-script timeouts in noise.
  # Closing from this side first keeps the connection reuse and leaves the
  # worker idle and alive. Raise the pool's timeout before raising this one.
  keepalive_timeout 20s;
}

server {
  listen 80;
  # Accept all subdomains and localhost for development
  server_name localhost *.localhost;

  # No real_ip directives here on purpose. REMOTE_ADDR is the peer nginx
  # actually accepted, which is the only address nothing upstream can forge.
  #
  # Trusting a range here rewrites REMOTE_ADDR from a client-supplied header,
  # so the range must name the proxy and nothing else. Every connection through
  # a published port arrives from the Docker bridge's gateway, so trusting the
  # gateway is only safe while the port is bound to 127.0.0.1: then nothing
  # but a process on the host can come through it.
  #
  # The prod stack is that case. docker/nginx/real-ip.sh writes real-ip.conf
  # at start, believing the gateway alone (or NGINX_TRUSTED_PROXY, if set).
  # See docker-compose.prod.yml.

  access_log /var/log/nginx/access.log redacted;

  # The Server header and nginx's own error pages say "nginx" and no release.
  server_tokens off;

  client_max_body_size 32m;

  # The parent dir is mounted at /var/www/html (so the vendor symlinks to the
  # sibling packages resolve); the runnable app lives in app/.
  root /var/www/html/app/public;
  index index.php index.html;

  # Gzip compression (level 4: good ratio, low CPU)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Security headers are set by the app's SecurityHeadersMiddleware (the single,
  # server-agnostic source of truth), so nginx must NOT also add them: doing so
  # duplicates each header on every response.

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  # Event streams go to the SSE hub, never to php-fpm. The name is resolved
  # per request through Docker's DNS, so nginx still starts when the sse
  # service is not running; /stream is then a 502 and everything else works.
  # /stream/token is an ordinary PHP route, and `=` keeps it out of here.
  location = /stream {
    # The access log redacts the listen token (see $loggable_uri), but an
    # error line carries the raw request, and with the hub down every browser
    # retry would write one. A down hub shows on System Health and as 502s in
    # the access log, so only crit and worse are kept here.
    error_log /var/log/nginx/error.log crit;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sse_hub http://sse:8080;
    proxy_pass $sse_hub;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Every event on its way at once: no buffering, no gzip holding bytes
    # back, and no read timeout short of the heartbeat.
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
  }

  # A fingerprinted name, as $this->asset() prints it: app.3f2a1c9b0e.css is
  # app.css whose bytes hash to 3f2a1c9b0e. The name changes whenever the file
  # does, so it can be kept for a year without the browser ever asking again,
  # and an edit still reaches everyone on their next page, under a new name.
  # The extensions are listed rather than matched, so nothing that runs (.php)
  # and no dotfile is ever served through here.
  #
  # Regex locations are tried in the order written, and a ^~ prefix block
  # stops nginx from trying them at all: a `location ^~ /css/` in front of
  # this one would answer /css/app.3f2a1c9b0e.css itself, with a 404.
  location ~* "^(?<asset>/.+)\.[0-9a-f]{10}(?<ext>\.(?:css|js|mjs|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico))$" {
    try_files $asset$ext =404;
    # Not `always`: a 404 here must not be kept for a year by a browser or a
    # CDN, or a file deployed a moment after its page stays missing.
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # The same files under their plain names, which only a link that skipped
  # asset() still uses. Revalidated (ETag/Last-Modified -> 304) on every use,
  # never immutable: an immutable plain name stops the browser asking at all,
  # so an edit could not reach anyone who had already loaded it.
  location ~* \.(?:css|js|mjs)$ {
    add_header Cache-Control "no-cache" always;
    access_log off;
  }

  location ~* \.(?:woff2?|ttf|otf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # The public disk (storage/public, linked as public/storage). Every name on it
  # was chosen by the app from the file's bytes, so nothing here is a script
  # and every extension is true; ^~ keeps the .php rule below from ever seeing
  # a path in here regardless. A key never changes content (a replaced file
  # gets a new key), so it caches for good. PHP never answers these requests,
  # so the headers the app's middleware would set are set here instead.
  location ^~ /storage/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    access_log off;
  }

  location ~* \.(?:jpg|jpeg|png|gif|webp|avif|ico|svg)$ {
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass php-fpm;
    fastcgi_keep_conn on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    # Pass the Host header to PHP so subdomain routing works
    fastcgi_param HTTP_HOST $host;
    # The app adopts this as the request id, so whatever the client sent is replaced
    fastcgi_param HTTP_X_REQUEST_ID $request_id;

    # Buffer tuning and timeouts (match PHP's 30s max_execution_time)
    fastcgi_buffer_size 16k;
    fastcgi_buffers 8 16k;
    fastcgi_connect_timeout 10s;
    fastcgi_send_timeout 30s;
    fastcgi_read_timeout 30s;
  }

  # Deny access to all dotfiles (.env, .git, .htaccess, etc.)
  location ~ /\. {
    deny all;
  }
}
