# Base stack for the Hydra app skeleton.
#
# The project is mounted at /var/www/html/app whatever its directory is called
# on the host, so `composer create-project hydrakit/app myapp` runs as it is.
# nginx's root, the workers' working_dir and ./bin/exec all name that path.
#
# Working on the framework itself, vendor/hydrakit/* are symlinks into a
# ../hydra checkout beside this one (composer.dev.json). The container cannot
# see ../ on its own; docker-compose.local.yml.example has the extra mount
# that lets the symlinks resolve.
#
# The Compose project name is left unset on purpose: it defaults to this
# directory's name (app), so a copy of this stack in any sibling project is
# namespaced correctly with nothing to configure.
#
# The base is production-shaped: prod.ini, OPcache on, display_errors off. It is
# what you get when nothing says otherwise, and "nothing says otherwise" is
# exactly the case that must not leak a stack trace. Development is the overlay,
# and ./bin/dev applies it for you.
#
#   ./bin/dev up -d --build         # base + dev (xdebug, dev.ini), recommended
#   ./bin/dev logs -f scheduler     # what schedule:run did each minute
#   ./bin/dev logs -f sse           # the SSE hub: streams opened, Redis lost
#   docker compose up -d            # base only, production-shaped

services:
  php:
    build:
      context: ./docker/php
      args:
        # Default to prod; docker-compose.dev.yml overrides to dev.
        BUILD_MODE: ${BUILD_MODE:-prod}
    volumes:
      - ./:/var/www/html/app
      # prod.ini by default; dev.yml swaps in dev.ini at the same target.
      - ./docker/php/prod.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro
    networks:
      - net

  # cron for schedule:run, without cron: the same image, ticking once a minute.
  # Each run is started in the background the way cron would start it, so a
  # long drain does not hold up the minutes after it; "(… &)" hands the run to
  # PID 1, which init: true makes tini, so finished runs are reaped rather than
  # left as zombies. Root, like `docker exec`: www-data cannot write into the
  # bind-mounted bootstrap/cache, and the web never reads the locks.
  scheduler:
    build:
      context: ./docker/php
      args:
        BUILD_MODE: ${BUILD_MODE:-prod}
    init: true
    working_dir: /var/www/html/app
    command: ["sh", "-c", "while :; do (php bin/console schedule:run &); sleep $$((60 - $$(date +%s) % 60)); done"]
    volumes:
      - ./:/var/www/html/app
      - ./docker/php/prod.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro
    depends_on:
      - db
      - redis
    networks:
      - net

  # The SSE hub: browsers' event streams, held here because a stream held by
  # php-fpm keeps a worker busy for as long as the tab is open. It listens on
  # 8080 inside the network only; nginx proxies /stream to it. www-data, not
  # root like the scheduler: it writes nothing but the log.
  sse:
    build:
      context: ./docker/php
      args:
        BUILD_MODE: ${BUILD_MODE:-prod}
    init: true
    user: www-data
    working_dir: /var/www/html/app
    command: ["php", "bin/console", "sse:serve"]
    # The php:fpm base says SIGQUIT, which is php-fpm's graceful stop; the hub
    # stops cleanly on either, and SIGTERM says what is meant.
    stop_signal: SIGTERM
    volumes:
      - ./:/var/www/html/app
      - ./docker/php/prod.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro
    depends_on:
      - redis
    networks:
      - net

  nginx:
    image: nginx:alpine
    sysctls:
      - net.ipv4.tcp_tw_reuse=1
    volumes:
      - ./:/var/www/html/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - net

  db:
    image: mariadb:11
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/db_data:/var/lib/mysql
    networks:
      - net

  redis:
    image: redis:7-alpine
    restart: "no"
    volumes:
      - redis_data:/data
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  net:

volumes:
  redis_data:
