# Development overrides: portable, no external dependencies.
# Use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Or via ./bin/dev (which also layers in docker-compose.local.yml if present).
#
# Publishes nginx on the host so the stack is reachable without any reverse
# proxy: http://localhost:${APP_PORT:-8080}. Personal, machine-specific niceties
# (e.g. a shared Traefik proxy for *.localhost hostnames) belong in
# docker-compose.local.yml, which is gitignored and auto-loaded by ./bin/dev.

services:
  php:
    build:
      context: ./docker/php
      args:
        BUILD_MODE: dev
    volumes:
      - ../:/var/www/html
      # Override: dev.ini instead of the base's prod.ini. This is what turns on
      # display_errors and xdebug and turns OPcache off, and it is deliberately
      # something you opt into rather than something you remember to remove.
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro

  scheduler:
    build:
      context: ./docker/php
      args:
        BUILD_MODE: dev
    volumes:
      - ../:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro

  nginx:
    ports:
      - "${APP_PORT:-8080}:80"

  # Catches every message sent to mailpit:1025 and delivers none of them. The
  # inbox is on localhost only: it holds working reset links.
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - net
