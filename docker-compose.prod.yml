# Production overrides
# Use with: ./bin/prod up -d --build
# Caddy on the host terminates TLS on 80/443 and forwards to the loopback port
# nginx publishes below. https://hydra.williamhleucka.com/docs/deploy.html

# BUILD_MODE and prod.ini are not repeated here: they are what the base already
# does. What is left is what only production wants — restart policies, memory
# limits, the real-ip config and Redis's eviction policy.

services:
  php:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M

  scheduler:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  sse:
    restart: unless-stopped
    # A file descriptor per browser: SSE_MAX_CONNECTIONS (1000 by default)
    # needs more than the usual 1024, with room for the heads being read.
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    restart: unless-stopped
    # Loopback only. Docker's publish goes around the host firewall, so a bare
    # port would be on the internet; this way only the host's proxy reaches it.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      # Optional. Unset, the address nginx believes X-Forwarded-For from is
      # the Docker network's gateway, read at start by real-ip.sh: where the
      # host's proxy arrives from through the port above.
      NGINX_TRUSTED_PROXY: ${NGINX_TRUSTED_PROXY:-}
    volumes:
      - ./docker/nginx/real-ip.sh:/docker-entrypoint.d/30-real-ip.sh:ro
    deploy:
      resources:
        limits:
          memory: 128M

  db:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    restart: unless-stopped
    # noeviction, not allkeys-lru. These keys are rate-limit counters, and an
    # evictable counter is a budget anyone can clear: fill the instance and
    # every limit in the application resets. Under pressure Redis instead
    # refuses the write, the store raises, and the limiter fails closed.
    # The password the application sends (REDIS_PASSWORD in .env), required
    # here: the app AUTHs whenever it is set, and a server without one refuses
    # every command that does. REDISCLI_AUTH lets the healthcheck's redis-cli in.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
    deploy:
      resources:
        limits:
          memory: 192M
