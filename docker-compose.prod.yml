# Production overrides
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# A host-level reverse proxy (e.g. Caddy/Traefik) handles TLS on 80/443.

services:
  php:
    build:
      context: ./docker/php
      args:
        BUILD_MODE: prod
    restart: unless-stopped
    volumes:
      - ../:/var/www/html
      # Override: mount prod.ini instead of dev.ini.
      - ./docker/php/prod.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro
    deploy:
      resources:
        limits:
          memory: 2048M

  nginx:
    restart: unless-stopped
    environment:
      # The reverse proxy in front of this stack: one address or CIDR block.
      # Only this peer's X-Forwarded-For is believed; everything else keeps the
      # address nginx actually accepted. Set NGINX_TRUSTED_PROXY in .env to the
      # proxy's address on the Docker network, NOT to the bridge subnet: a
      # published port makes external callers arrive from the bridge gateway,
      # so a subnet-wide range would let any client name itself.
      NGINX_TRUSTED_PROXY: ${NGINX_TRUSTED_PROXY:?set NGINX_TRUSTED_PROXY to the reverse proxy address}
    volumes:
      # envsubst renders templates/*.template into conf.d/ at container start.
      - ./docker/nginx/real-ip.conf.template:/etc/nginx/templates/real-ip.conf.template:ro
    deploy:
      resources:
        limits:
          memory: 128M

  db:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    deploy:
      resources:
        limits:
          memory: 192M
